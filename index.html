<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<meta name="description" content="고양이와 함께하는 집중 타이머. 끝까지 집중하면 간식을 줄 수 있어요.">
<meta name="theme-color" content="#ece3d4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1a1d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="콩이네 방">
<meta property="og:title" content="콩이네 방">
<meta property="og:description" content="고양이와 함께하는 집중 타이머. 끝까지 집중하면 간식을 줄 수 있어요.">

<style>
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gaegu:wght@400;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a window into the room on the left, a quiet control panel on the right; stacks on phones. */
:root{
  --bg:#ece3d4; --fg:#372c25; --muted:#857566; --panel:#f6f0e6; --line:#d8c9b4;
  --accent:#4f6d52; --accent-fg:#fbf8f2; --soft:#e4dccd; --danger:#a65b3b;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --hand:"Gaegu","Gowun Dodum",cursive;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1f1a1d; --fg:#efe5d6; --muted:#a3958a; --panel:#2a2327; --line:#3f353a;
    --accent:#8fb08f; --accent-fg:#1c1a16; --soft:#352d31; --danger:#d98a66; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1f1a1d; --fg:#efe5d6; --muted:#a3958a; --panel:#2a2327; --line:#3f353a;
  --accent:#8fb08f; --accent-fg:#1c1a16; --soft:#352d31; --danger:#d98a66; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px}
.app{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand input{font:inherit;font-size:22px;color:var(--fg);background:transparent;border:0;border-bottom:1.5px dashed var(--line);width:3.4em;padding:0 2px;text-align:center}
.brand input:focus{outline:none;border-bottom-color:var(--accent)}
.brand .suffix{font-size:22px}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.today{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
select{font:inherit;font-size:13px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
main{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:720px){main{grid-template-columns:1fr}}

/* ---------- The room ---------- */
.scene{position:relative;aspect-ratio:16/10;max-width:100%;overflow:hidden;border-radius:18px;container-type:inline-size;
  --wall:#ead6bf;--wall2:#d9bf9f;--floor:#b98a5c;--floor2:#a4784b;--sky1:#9fd0ef;--sky2:#e3f1f8;--shade:transparent;--lamp:0;--moon:0;--sun:1;
  background:var(--wall);box-shadow:0 10px 30px rgba(0,0,0,.12)}
.scene.t-morning{--wall:#f2e0c8;--wall2:#e4c9a8;--sky1:#bfe0f4;--sky2:#fbe7c2;--shade:rgba(255,225,170,.14)}
.scene.t-sunset{--wall:#e6c3a2;--wall2:#d3a683;--floor:#a97548;--floor2:#946340;--sky1:#f3a46b;--sky2:#7d4f7f;--shade:rgba(255,120,60,.14);--lamp:.6;--sun:.5}
.scene.t-night{--wall:#4a3b47;--wall2:#3a2d38;--floor:#5a3f33;--floor2:#4a3329;--sky1:#141a38;--sky2:#2b365f;--shade:rgba(15,10,40,.26);--lamp:1;--moon:1;--sun:0}
.scene>*{position:absolute}
.wall{inset:0 0 28% 0;background:linear-gradient(var(--wall),var(--wall2))}
.floor{left:0;right:0;bottom:0;height:28%;background:repeating-linear-gradient(90deg,var(--floor) 0 9%,var(--floor2) 9% 9.5%)}
.baseboard{left:0;right:0;bottom:27.4%;height:1.4%;background:rgba(0,0,0,.14)}
.window{left:7%;top:8%;width:25%;height:34%;background:linear-gradient(var(--sky1),var(--sky2));border:1.1cqw solid #efe4d2;border-radius:1cqw;box-shadow:0 .4cqw 1.2cqw rgba(0,0,0,.12)}
.window::before,.window::after{content:"";position:absolute;background:#efe4d2}
.window::before{left:50%;top:0;bottom:0;width:.9cqw;transform:translateX(-50%)}
.window::after{top:50%;left:0;right:0;height:.9cqw;transform:translateY(-50%)}
.window .sun{position:absolute;right:16%;top:16%;width:22%;aspect-ratio:1;border-radius:50%;background:#ffe9a8;box-shadow:0 0 2cqw #ffe9a8;opacity:var(--sun)}
.window .moon{position:absolute;right:20%;top:14%;width:18%;aspect-ratio:1;border-radius:50%;background:#f4f0d8;box-shadow:0 0 2.4cqw rgba(255,250,220,.7);opacity:var(--moon)}
.window .stars{position:absolute;inset:0;opacity:var(--moon);background:
  radial-gradient(circle,#fff 0 .35cqw,transparent .5cqw) 18% 30%/100% 100% no-repeat,
  radial-gradient(circle,#fff 0 .3cqw,transparent .45cqw) 30% 62%/100% 100% no-repeat,
  radial-gradient(circle,#fff 0 .3cqw,transparent .45cqw) 62% 70%/100% 100% no-repeat,
  radial-gradient(circle,#fff 0 .25cqw,transparent .4cqw) 10% 75%/100% 100% no-repeat,
  radial-gradient(circle,#fff 0 .25cqw,transparent .4cqw) 45% 20%/100% 100% no-repeat}
.window .hill{position:absolute;left:-5%;right:-5%;bottom:-2%;height:30%;border-radius:50% 50% 0 0;background:rgba(60,90,70,.55)}
.window .bird{position:absolute;left:20%;top:38%;width:9%;height:3%;border:.35cqw solid rgba(40,40,60,.55);border-width:.35cqw 0 0 0;border-radius:50% 50% 0 0;animation:fly 11s linear infinite;opacity:0}
.window .bird::after{content:"";position:absolute;left:100%;top:-.35cqw;width:100%;height:100%;border-top:.35cqw solid rgba(40,40,60,.55);border-radius:50% 50% 0 0}
@keyframes fly{0%{opacity:0;transform:translate(-40%,30%) scale(.8)}8%{opacity:1}40%{opacity:1;transform:translate(260%,-60%) scale(1)}48%{opacity:0;transform:translate(330%,-80%)}100%{opacity:0}}
.curtain{top:5%;width:5.5%;height:41%;background:linear-gradient(90deg,#b36a5c,#9d5a4e);border-radius:0 0 45% 45%}
.curtain.l{left:3.5%}.curtain.r{left:30.5%}
.sofa{left:4%;bottom:22%;width:36%;height:24%}
.sofa>*{position:absolute}
.sofa .back{left:5%;right:5%;top:0;height:58%;background:#6f8f7a;border-radius:14% 14% 0 0/30% 30% 0 0}
.sofa .seat{left:0;right:0;bottom:10%;height:44%;background:#7fa08a;border-radius:8%;box-shadow:inset 0 -.8cqw rgba(0,0,0,.12)}
.sofa .arm{bottom:10%;width:12%;height:64%;background:#6a8a75;border-radius:40% 40% 6% 6%}
.sofa .arm.l{left:0}.sofa .arm.r{right:0}
.sofa .cushion{left:62%;top:30%;width:22%;height:32%;background:#e8c88a;border-radius:12%;transform:rotate(8deg);box-shadow:inset 0 -.4cqw rgba(0,0,0,.1)}
.sofa .leg{bottom:0;width:5%;height:10%;background:#5b4a3a}.sofa .leg.l{left:6%}.sofa .leg.r{right:6%}
.rug{left:34%;bottom:3%;width:34%;height:12%;border-radius:50%;
  background:radial-gradient(ellipse at center,#b35d63 0 54%,#8f4650 55% 68%,#d9a66f 69% 76%,#8f4650 77%)}
.desk{left:60%;bottom:24%;width:24%;height:16%}
.desk>*{position:absolute}
.desk .top{left:0;right:0;top:0;height:16%;background:#7b5234;border-radius:6%;box-shadow:0 .4cqw .6cqw rgba(0,0,0,.15)}
.desk .leg{top:16%;width:7%;height:84%;background:#67432d}.desk .leg.l{left:5%}.desk .leg.r{right:5%}
.lamp{right:2%;bottom:84%;width:22%;height:120%}
.lamp>*{position:absolute}
.lamp .shade{top:0;left:0;right:0;height:40%;background:#e8c47a;clip-path:polygon(28% 0,72% 0,100% 100%,0 100%)}
.lamp .pole{left:46%;top:40%;width:8%;height:50%;background:#5b4a3a}
.lamp .base{bottom:0;left:22%;right:22%;height:12%;background:#5b4a3a;border-radius:50%}
.lamp .glow{left:-120%;right:-120%;top:10%;height:220%;background:radial-gradient(ellipse at 50% 15%,rgba(255,214,120,.55),transparent 62%);opacity:var(--lamp);pointer-events:none;transition:opacity 1s}
.books{left:5%;bottom:84%;width:36%;display:flex;flex-direction:column-reverse;align-items:flex-start}
.book{height:1.5cqw;border-radius:.3cqw;box-shadow:inset 0 -.35cqw rgba(0,0,0,.18)}
.books .more{position:absolute;left:100%;bottom:0;margin-left:.6cqw;font:700 2.2cqw var(--hand);color:#fff;text-shadow:0 .1cqw .3cqw rgba(0,0,0,.4);white-space:nowrap}
.door{left:88%;top:16%;width:10%;height:56.2%;background:linear-gradient(90deg,#8a5a3c,#7c4f33);border:.6cqw solid #66422c;border-bottom:0;border-radius:1cqw 1cqw 0 0}
.door::before{content:"";position:absolute;left:18%;right:18%;top:8%;height:36%;border:.4cqw solid rgba(0,0,0,.18);border-radius:.5cqw}
.door::after{content:"";position:absolute;left:18%;right:18%;top:54%;height:36%;border:.4cqw solid rgba(0,0,0,.18);border-radius:.5cqw}
.door .knob{position:absolute;right:12%;top:49%;width:16%;aspect-ratio:1;border-radius:50%;background:#e6c267}
.bowl{left:76%;bottom:4%;width:9%;height:4.5%;background:#5a7f9c;border-radius:0 0 45% 45%/0 0 100% 100%}
.bowl::before{content:"";position:absolute;left:-6%;right:-6%;top:-28%;height:56%;background:#6e94b0;border-radius:50%}
.bowl .food{position:absolute;left:14%;right:14%;top:-14%;height:48%;border-radius:50%;background:#c77b4a;opacity:0;transition:all .45s}
.bowl[data-level="3"] .food{opacity:1}
.bowl[data-level="2"] .food{opacity:1;left:22%;right:22%;top:-6%;height:40%}
.bowl[data-level="1"] .food{opacity:1;left:34%;right:34%;top:4%;height:30%}
.treat{width:3.2%;aspect-ratio:1.5;background:#d98c4e;border-radius:45%;left:79%;bottom:34%;opacity:0;box-shadow:inset 0 -.2cqw rgba(0,0,0,.2)}
.treat.drop{animation:drop .75s cubic-bezier(.4,0,.8,1) forwards}
@keyframes drop{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:1;transform:translateY(790%) rotate(50deg)}}
.shade-ov{inset:0;background:var(--shade);pointer-events:none;transition:background 1s}

/* ---------- cat ---------- */
.cat{width:17%;left:13%;bottom:35%;cursor:default;--cat:#e39a4c;--cat2:#c6782c;--ear:#f2b2a0;--eye:#2e2a24}
.cat.petable{cursor:pointer}
.cat .wrap{transition:transform .15s}
.cat.flip .wrap{transform:scaleX(-1)}
.cat svg{width:100%;height:auto;display:block;overflow:visible}
.cat svg>g{display:none}
.cat[data-pose="sit"] .p-sit,.cat[data-pose="wait"] .p-sit,.cat[data-pose="groom"] .p-sit,.cat[data-pose="eat"] .p-sit,.cat[data-pose="lick"] .p-sit{display:block}
.cat[data-pose="sleep"] .p-lie,.cat[data-pose="lie"] .p-lie{display:block}
.cat[data-pose="back"] .p-back{display:block}
.cat[data-pose="walk"] .p-walk{display:block}
.cat[data-pose="stretch"] .p-stretch{display:block}
.cat .body,.cat .face,.cat .paw,.cat .ear,.cat .leg rect{fill:var(--cat)}
.cat .ear-in{fill:var(--ear)}
.cat .ear-back{fill:var(--cat2);opacity:.55}
.cat .stripe{stroke:var(--cat2);stroke-width:2.6;fill:none;stroke-linecap:round}
.cat .tail{stroke:var(--cat);stroke-width:8;fill:none;stroke-linecap:round;transform-box:fill-box;transform-origin:100% 100%;animation:sway 3.2s ease-in-out infinite alternate}
.cat .p-back .tail{transform-origin:0% 100%;animation-duration:4s}
.cat .eye{fill:var(--eye)}
.cat .glint{fill:#fff}
.cat .eyes-wrap{transition:transform .35s}
.cat .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
.cat .eyes-closed,.cat .eyes-happy{stroke:var(--eye);stroke-width:2;fill:none;stroke-linecap:round}
.cat .nose{fill:#d98a86}.cat .mouth{stroke:#9a5a52;stroke-width:1.6;fill:none;stroke-linecap:round}
.cat .yawn-mouth{fill:#9a4a48}.cat .tongue{fill:#e58a9a}
.cat .whisk{stroke:rgba(60,40,20,.5);stroke-width:1.2;stroke-linecap:round}
.cat .head{transform-box:fill-box;transform-origin:50% 90%;transition:transform .6s}
.cat .ear{transform-box:fill-box;transform-origin:50% 100%}
.cat .eyes-closed,.cat .eyes-happy,.cat .tongue,.cat .yawn-mouth{display:none}
.cat.closed .eyes{display:none}.cat.closed .eyes-closed{display:block}
.cat.happy .eyes{display:none}.cat.happy .eyes-happy{display:block}
.cat[data-pose="lick"] .tongue{display:block;animation:lick .45s ease-in-out infinite alternate}
.cat.yawn .eyes{display:none}.cat.yawn .eyes-closed{display:block}.cat.yawn .yawn-mouth{display:block}.cat.yawn .mouth{display:none}
.cat.yawn .p-sit .head,.cat.yawn .p-lie .head{transform:rotate(-9deg) translateY(-1px)}
.cat.look-l .eyes-wrap{transform:translateX(-2.4px)}.cat.look-r .eyes-wrap{transform:translateX(2.4px)}
.cat.look-l .p-sit .head,.cat.look-l .p-lie .head{transform:rotate(-6deg)}.cat.look-r .p-sit .head,.cat.look-r .p-lie .head{transform:rotate(6deg)}
.cat.look-l .p-back .head{transform:rotate(-16deg) translateX(-4px)}.cat.look-r .p-back .head{transform:rotate(16deg) translateX(4px)}
.cat.twitch .ear.r{animation:twitch .5s ease-in-out}
.cat.flick .tail{animation:flick .6s ease-in-out}
.cat .p-lie .body,.cat .p-sit .body,.cat .p-back .body{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.4s ease-in-out infinite}
.cat[data-pose="sleep"] .p-lie .body{animation-duration:4.6s}
.cat[data-pose="eat"] .p-sit .head{animation:nibble .42s ease-in-out infinite alternate}
.cat[data-pose="lick"] .p-sit .head{transform:rotate(-6deg) translateY(-2px)}
.cat[data-pose="groom"] .p-sit .head{animation:groom 1.1s ease-in-out infinite alternate}
.cat[data-pose="groom"] .paw.l{animation:pawwash 1.1s ease-in-out infinite alternate}
.cat .paw{transform-box:fill-box;transform-origin:50% 100%;transition:transform .5s}
.cat[data-pose="wait"] .p-sit .head{transform:rotate(-7deg) translate(2px,-2px)}
.cat[data-pose="wait"] .tail{animation-duration:1.1s}
.cat .p-walk .leg{transform-box:fill-box;transform-origin:50% 0}
.cat.walking .p-walk .leg.f1,.cat.walking .p-walk .leg.b2{animation:step .36s ease-in-out infinite alternate}
.cat.walking .p-walk .leg.f2,.cat.walking .p-walk .leg.b1{animation:step .36s ease-in-out infinite alternate-reverse}
.cat.walking .p-walk .tail{animation:sway 1.4s ease-in-out infinite alternate}
.cat.walking svg{animation:bob .36s ease-in-out infinite alternate}
.cat.jump svg{animation:hop .45s ease-out}
.cat .p-stretch .body{transform-box:fill-box;transform-origin:50% 100%;animation:stretchy 2.4s ease-in-out}
.cat .zzz{position:absolute;left:62%;top:-8%;font:700 3.4cqw var(--hand);color:#fff;text-shadow:0 .1cqw .5cqw rgba(0,0,0,.45);display:none;pointer-events:none}
.cat[data-pose="sleep"] .zzz{display:block}
.cat .zzz span{position:absolute;left:0;animation:zz 2.6s ease-in-out infinite;opacity:0}
.cat .zzz span:nth-child(2){animation-delay:.85s;font-size:.8em}
.cat .zzz span:nth-child(3){animation-delay:1.7s;font-size:.65em}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}25%{opacity:1}100%{opacity:0;transform:translate(1.6cqw,-4cqw)}}
@keyframes sway{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes flick{0%{transform:rotate(0)}30%{transform:rotate(26deg)}70%{transform:rotate(-14deg)}100%{transform:rotate(0)}}
@keyframes twitch{0%,100%{transform:rotate(0)}30%{transform:rotate(-18deg)}60%{transform:rotate(8deg)}}
@keyframes blink{0%,91%{transform:scaleY(1)}94%{transform:scaleY(.12)}97%,100%{transform:scaleY(1)}}
@keyframes breathe{from{transform:scaleY(1)}50%{transform:scaleY(1.03)}to{transform:scaleY(1)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3%)}}
@keyframes hop{0%{transform:translateY(0)}40%{transform:translateY(-14%) scaleY(1.06)}100%{transform:translateY(0)}}
@keyframes step{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes nibble{from{transform:translate(16px,16px) rotate(20deg)}to{transform:translate(16px,19px) rotate(27deg)}}
@keyframes lick{from{transform:translateY(0)}to{transform:translateY(2.5px)}}
@keyframes groom{from{transform:rotate(-14deg) translate(-3px,3px)}to{transform:rotate(-5deg) translate(-1px,1px)}}
@keyframes pawwash{from{transform:translate(-2px,-16px) rotate(-30deg)}to{transform:translate(-5px,-22px) rotate(-40deg)}}
@keyframes stretchy{0%{transform:scaleX(.9) scaleY(1.05)}40%{transform:scaleX(1.04) scaleY(.97)}100%{transform:scaleX(1) scaleY(1)}}
.heart{position:absolute;color:#e46b7a;font-size:3.2cqw;line-height:1;animation:rise 1.4s ease-out forwards;pointer-events:none;user-select:none}
@keyframes rise{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-9cqw) scale(1.1)}}
.crumb{position:absolute;width:.9cqw;height:.9cqw;border-radius:50%;background:#c77b4a;animation:crumb .7s ease-out forwards;pointer-events:none}
@keyframes crumb{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),2.5cqw)}}
.bubble{background:#fff;color:#4a3b2f;font:700 3cqw/1 var(--hand);font-size:max(3cqw,13px);padding:.8cqw 1.4cqw;border-radius:2cqw;box-shadow:0 .3cqw .8cqw rgba(0,0,0,.18);pointer-events:none}
.bubble::after{content:"";position:absolute;left:28%;bottom:-.9cqw;width:1.6cqw;height:1.6cqw;background:#fff;transform:rotate(45deg)}
.scene .caption{left:0;right:0;bottom:0;padding:.8cqw 1.6cqw;font:2.3cqw/1.3 var(--hand);font-size:max(2.3cqw,11px);color:#fff;text-shadow:0 .1cqw .5cqw rgba(0,0,0,.5);background:linear-gradient(transparent,rgba(0,0,0,.28));pointer-events:none}

/* ---------- Panel ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{margin:0;font-size:17px;font-weight:400}
.panel p{margin:0;color:var(--muted);font-size:14px}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;background:var(--soft);color:var(--fg);border:1px solid transparent;border-radius:999px;padding:8px 16px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--accent);background:transparent;color:var(--accent)}
.chip:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.custom{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.custom input{font:inherit;font-family:var(--mono);width:5em;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--fg);text-align:right}
.btn{font:inherit;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:var(--accent);color:var(--accent-fg);font-size:15px}
.btn.secondary{background:var(--soft);color:var(--fg)}
.btn.quiet{background:transparent;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:6px 8px;font-size:13px}
.btn.big{padding:16px 20px;font-size:17px;animation:pulse 1.6s ease-in-out infinite}
.btn:disabled{opacity:.5;cursor:default;animation:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.clock{font-family:var(--mono);font-size:clamp(46px,8vw,64px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s linear}
.status{font-size:15px;min-height:1.6em}
.hint{font-size:12.5px;color:var(--muted)}
footer{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
footer .sum{font-size:14px}
footer .items{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lg-book{width:12px;height:30px;border-radius:3px;box-shadow:inset 0 -5px rgba(0,0,0,.18)}
.lg-stop{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:transparent;margin-inline:3px}
footer .empty{color:var(--muted);font-size:13.5px}
.modal{position:fixed;inset:0;background:rgba(20,14,10,.5);display:flex;align-items:center;justify-content:center;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.sheet{background:var(--panel);color:var(--fg);border-radius:18px;padding:22px;max-width:420px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.sheet h3{margin:0;font-size:18px;font-weight:400}
.sheet p{margin:0;color:var(--muted);font-size:14px}
.card-wrap{display:flex;justify-content:center}
.card-wrap canvas{width:auto;height:min(56vh,520px);max-width:100%;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){
  .cat *,.cat svg,.btn.big,.window .bird{animation:none!important}
}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">
      <input id="petName" aria-label="고양이 이름" maxlength="6" value="콩이">
      <span class="suffix">네 방</span>
    </div>
    <div class="hdr-right">
      <span class="today" id="todaySum"></span>
      <select id="todSel" aria-label="방 시간대">
        <option value="auto">시간대: 자동</option>
        <option value="morning">아침</option>
        <option value="day">낮</option>
        <option value="sunset">노을</option>
        <option value="night">밤</option>
      </select>
      <button class="btn secondary" id="shareBtn" type="button">오늘의 방 카드</button>
    </div>
  </header>

  <main>
    <section class="scene t-day" id="scene" aria-label="고양이가 있는 방">
      <div class="wall"></div>
      <div class="floor"></div>
      <div class="baseboard"></div>
      <div class="window"><div class="stars"></div><div class="sun"></div><div class="moon"></div><div class="hill"></div><div class="bird"></div></div>
      <div class="curtain l"></div><div class="curtain r"></div>
      <div class="door"><div class="knob"></div></div>
      <div class="rug"></div>
      <div class="sofa"><div class="leg l"></div><div class="leg r"></div><div class="back"></div><div class="seat"></div><div class="arm l"></div><div class="arm r"></div><div class="cushion"></div></div>
      <div class="desk"><div class="leg l"></div><div class="leg r"></div><div class="top"></div>
        <div class="lamp"><div class="glow"></div><div class="pole"></div><div class="base"></div><div class="shade"></div></div>
        <div class="books" id="books"></div>
      </div>
      <div class="bowl" id="bowl" data-level="0"><div class="food"></div></div>
      <div class="treat" id="treat"></div>
      <div class="cat" id="cat" data-pose="sleep" data-spot="sofa">
        <div class="wrap" id="catSvg"></div>
        <div class="zzz"><span>z</span><span>z</span><span>z</span></div>
      </div>
      <div class="shade-ov"></div>
      <div class="bubble" id="bubble" hidden>…</div>
      <div class="caption" id="caption"></div>
    </section>

    <section class="panel" id="panel">
      <div id="ui-setup">
        <div style="display:flex;flex-direction:column;gap:14px">
          <h2>오늘은 몇 분 집중할까요?</h2>
          <div class="presets" role="group" aria-label="집중 시간">
            <button class="chip" type="button" data-min="25" aria-pressed="true">25분</button>
            <button class="chip" type="button" data-min="50">50분</button>
            <button class="chip" type="button" data-min="90">90분</button>
          </div>
          <label class="custom">직접 입력 <input id="customMin" type="number" min="5" max="180" step="5" value="25" inputmode="numeric"> 분 <span class="hint">(최소 5분)</span></label>
          <p id="setupMsg">타이머가 도는 동안 고양이는 방에서 자기 시간을 보내요. 끝나면 간식을 줄 수 있어요.</p>
          <div class="btn-row">
            <button class="btn" id="startBtn" type="button">시작하기</button>
            <button class="btn quiet" id="demoBtn" type="button">30초로 체험해 보기</button>
          </div>
        </div>
      </div>

      <div id="ui-focus" hidden>
        <div style="display:flex;flex-direction:column;gap:14px">
          <div class="clock" id="clock">25:00</div>
          <div class="bar"><i id="barFill"></i></div>
          <div class="status" id="focusStatus"></div>
          <div class="btn-row">
            <button class="btn quiet" id="stopBtn" type="button">멈추기</button>
          </div>
        </div>
      </div>

      <div id="ui-done" hidden>
        <div style="display:flex;flex-direction:column;gap:14px">
          <h2 id="doneTitle">끝났어요</h2>
          <p id="doneMsg"></p>
          <div class="btn-row"><button class="btn big" id="treatBtn" type="button">간식 주기</button></div>
        </div>
      </div>

      <div id="ui-after" hidden>
        <div style="display:flex;flex-direction:column;gap:14px">
          <h2>냠냠.</h2>
          <p id="afterMsg"></p>
          <div class="btn-row">
            <button class="btn secondary" type="button" data-break="5">5분 쉬기</button>
            <button class="btn secondary" type="button" data-break="10">10분 쉬기</button>
            <button class="btn" id="nextBtn" type="button">바로 다음 세션</button>
          </div>
        </div>
      </div>

      <div id="ui-break" hidden>
        <div style="display:flex;flex-direction:column;gap:14px">
          <h2>쉬는 시간</h2>
          <div class="clock" id="breakClock">05:00</div>
          <div class="status" id="breakStatus"></div>
          <div class="btn-row"><button class="btn quiet" id="skipBreak" type="button">쉬는 시간 끝내기</button></div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <span class="sum" id="logSum"></span>
    <div class="items" id="logItems"></div>
    <span class="empty" id="logEmpty">아직 쌓인 책이 없어요. 한 세션을 마치면 책상 위에 책이 한 권 올라가요.</span>
  </footer>
</div>

<div class="modal" id="stopModal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="stopTitle">
    <h3 id="stopTitle">지금 멈출까요?</h3>
    <p id="stopMsg"></p>
    <div class="btn-row">
      <button class="btn" id="keepBtn" type="button">계속 집중하기</button>
      <button class="btn quiet" id="confirmStop" type="button">멈추기</button>
    </div>
  </div>
</div>

<div class="modal" id="shareModal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
    <h3 id="shareTitle">오늘의 방</h3>
    <p>인스타 스토리 비율(9:16)로 만든 카드예요. 길게 누르거나 우클릭해서 이미지를 저장할 수 있어요.</p>
    <div class="card-wrap"><canvas id="card" width="1080" height="1920"></canvas></div>
    <div class="btn-row"><button class="btn secondary" id="closeShare" type="button">닫기</button></div>
  </div>
</div>

<script>
(function(){
'use strict';
const $=(s,el)=>(el||document).querySelector(s);
const $$=(s,el)=>Array.from((el||document).querySelectorAll(s));
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const pad=n=>String(n).padStart(2,'0');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
function josa(name,a,b){const c=name.charCodeAt(name.length-1);if(c>=0xAC00&&c<=0xD7A3)return name+(((c-0xAC00)%28)?a:b);return name+b}
let petName=store.get('petName','콩이')||'콩이';
const Nga=()=>josa(petName,'이','가'),Nneun=()=>josa(petName,'은','는'),Nreul=()=>josa(petName,'을','를'),Nwa=()=>josa(petName,'과','와');
const fill=s=>s.replace(/\{N가\}/g,Nga()).replace(/\{N는\}/g,Nneun()).replace(/\{N를\}/g,Nreul()).replace(/\{N와\}/g,Nwa()).replace(/\{N\}/g,petName);
const reduced=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- cat svg ---------- */
function frontHead(tf){return `<g transform="${tf||''}"><g class="head">
  <polygon class="ear l" points="40,36 46,10 60,30"/><polygon class="ear r" points="66,30 80,10 86,36"/>
  <polygon class="ear-in" points="45,33 48,18 56,29"/><polygon class="ear-in" points="70,29 78,18 81,33"/>
  <circle class="face" cx="63" cy="40" r="21"/>
  <path class="stripe" d="M56 22 l2 8 M63 20 v8 M70 22 l-2 8"/>
  <g class="eyes-wrap"><g class="eyes"><ellipse class="eye" cx="54" cy="42" rx="3.2" ry="4.2"/><ellipse class="eye" cx="72" cy="42" rx="3.2" ry="4.2"/><circle class="glint" cx="55.2" cy="40.5" r="1"/><circle class="glint" cx="73.2" cy="40.5" r="1"/></g></g>
  <g class="eyes-closed"><path d="M50 43 q4 3 8 0 M68 43 q4 3 8 0"/></g>
  <g class="eyes-happy"><path d="M50 43 q4 -4 8 0 M68 43 q4 -4 8 0"/></g>
  <path class="nose" d="M60.5 48 h5 l-2.5 3 z"/>
  <path class="mouth" d="M59.5 51 q3.5 3 7 0"/>
  <ellipse class="yawn-mouth" cx="63" cy="53" rx="3.6" ry="4.2"/>
  <ellipse class="tongue" cx="63" cy="54" rx="2.4" ry="3"/>
  <path class="whisk" d="M38 46 h13 M38 50 l13 -1 M75 45 h13 M75 49 l13 1"/>
</g></g>`}
$('#catSvg').innerHTML=`<svg viewBox="0 0 120 100" aria-hidden="true">
<g class="p-sit">
  <path class="tail" d="M34 88 C 12 86, 8 62, 24 54"/>
  <path class="body" d="M34 96 C 30 66, 42 46, 62 46 C 84 46, 92 68, 90 96 Z"/>
  <path class="stripe" d="M52 60 q8 6 16 0 M48 72 q10 6 20 0 M47 84 q11 6 22 0"/>
  <ellipse class="paw l" cx="50" cy="95" rx="7" ry="4"/><ellipse class="paw r" cx="74" cy="95" rx="7" ry="4"/>
  ${frontHead('')}
</g>
<g class="p-lie">
  <path class="tail" d="M18 90 C 2 88, 2 66, 16 62"/>
  <path class="body" d="M14 96 C 12 74, 34 60, 64 60 C 92 60, 108 72, 108 96 Z"/>
  <path class="stripe" d="M40 72 q8 6 16 0 M36 84 q10 6 20 0 M58 68 q8 6 16 0"/>
  <ellipse class="paw" cx="30" cy="95" rx="8" ry="4"/><ellipse class="paw" cx="92" cy="95" rx="8" ry="4"/>
  ${frontHead('translate(26,26)')}
</g>
<g class="p-back">
  <path class="tail" d="M80 92 C 100 92, 108 74, 98 60"/>
  <path class="body" d="M30 96 C 26 66, 40 50, 60 50 C 80 50, 94 66, 90 96 Z"/>
  <path class="stripe" d="M48 64 q12 -5 24 0 M46 76 q14 -5 28 0 M46 88 q14 -5 28 0"/>
  <g class="head">
    <polygon class="ear l" points="42,34 46,8 60,28"/><polygon class="ear r" points="62,28 76,8 80,34"/>
    <polygon class="ear-back" points="46,31 48,15 57,28"/><polygon class="ear-back" points="65,28 74,15 76,31"/>
    <circle class="face" cx="61" cy="36" r="20"/>
    <path class="stripe" d="M54 22 l2 8 M61 20 v8 M68 22 l-2 8"/>
  </g>
</g>
<g class="p-walk">
  <path class="tail" d="M22 66 C 6 60, 4 42, 16 34"/>
  <g class="leg b1"><rect x="30" y="72" width="9" height="24" rx="4"/></g>
  <g class="leg f1"><rect x="72" y="72" width="9" height="24" rx="4"/></g>
  <path class="body" d="M22 76 C 20 56, 40 48, 62 48 C 82 48, 96 54, 98 70 C 98 80, 84 82, 60 82 C 40 82, 24 82, 22 76 Z"/>
  <path class="stripe" d="M40 56 q6 8 0 16 M54 54 q6 8 0 16 M68 54 q6 8 0 16"/>
  <g class="leg b2"><rect x="42" y="72" width="9" height="24" rx="4"/></g>
  <g class="leg f2"><rect x="84" y="72" width="9" height="24" rx="4"/></g>
  <g class="head">
    <polygon class="ear l" points="84,32 86,10 98,27"/><polygon class="ear r" points="100,27 112,12 114,34"/>
    <polygon class="ear-in" points="88,29 89,17 96,27"/><polygon class="ear-in" points="103,27 110,18 110,31"/>
    <circle class="face" cx="97" cy="44" r="17"/>
    <path class="stripe" d="M92 28 l1 7 M98 27 v7 M104 28 l-1 7"/>
    <g class="eyes-wrap"><g class="eyes"><ellipse class="eye" cx="103" cy="43" rx="2.6" ry="3.6"/><circle class="glint" cx="104" cy="41.8" r=".8"/></g></g>
    <g class="eyes-closed"><path d="M100 44 q3 2.5 6 0"/></g>
    <path class="nose" d="M111 47 l3.5 1.5 l-3 2.5 z"/>
    <path class="whisk" d="M106 50 l10 -1 M106 53 l10 1"/>
  </g>
</g>
<g class="p-stretch">
  <path class="tail" d="M20 58 C 6 50, 10 30, 24 26"/>
  <path class="body" d="M18 62 C 16 46, 34 42, 50 52 C 64 62, 78 76, 96 82 C 100 88, 98 94, 90 94 L 26 94 C 16 94, 14 74, 18 62 Z"/>
  <path class="stripe" d="M30 56 q8 -4 14 2 M42 62 q8 -3 14 4 M54 70 q8 -2 12 4"/>
  <rect class="paw" x="20" y="80" width="9" height="14" rx="4"/>
  <rect class="paw" x="84" y="86" width="30" height="8" rx="4"/>
  ${frontHead('translate(38,38) scale(.82)')}
</g>
</svg>`;

/* ---------- state ---------- */
const scene=$('#scene'),catEl=$('#cat'),bubble=$('#bubble'),bowl=$('#bowl');
let run=store.get('run',null); // {state:'focus'|'done'|'break', endAt, dur, demo}
let log=store.get('log',null); if(!log||log.date!==todayKey()) log={date:todayKey(),items:[]};
let ui='setup', phase='idle', idleTimer=null, lookTimer=null, audioCtx=null, moveId=0, curX=13, curY=35, isSulking=store.get('sulking',false);

/* ---------- cat movement ---------- */
const FLOOR=6;
const SPOTS={sofa:{x:13,y:35},win:{x:11,y:44},rug:{x:42,y:FLOOR},mid:{x:28,y:FLOOR},bowl:{x:59,y:FLOOR},eat:{x:64,y:FLOOR},door:{x:76,y:FLOOR}};
function setPose(p){catEl.dataset.pose=p;catEl.classList.toggle('closed',p==='sleep'||p==='stretch');catEl.classList.toggle('happy',p==='lick');
  if(p!=='sit'&&p!=='lie'&&p!=='wait'&&p!=='back')catEl.classList.remove('look-l','look-r','yawn')}
function setFace(f){catEl.classList.toggle('flip',f===-1)}
function setXY(x,y,tr){catEl.style.transition=tr||'none';catEl.style.left=x+'%';catEl.style.bottom=y+'%';curX=x;curY=y;
  bubble.style.left=(x+9)+'%';bubble.style.bottom=(y+19)+'%'}
async function moveCat(spot,pose,face,opts){
  opts=opts||{};const id=++moveId;const t=SPOTS[spot];
  catEl.classList.remove('walking','jump');
  if(catEl.dataset.spot===spot&&!opts.force){setPose(pose);setFace(face);return}
  catEl.dataset.spot=spot;
  if(opts.instant||reduced()){setXY(t.x,t.y);setPose(pose);setFace(face);return}
  const dir=t.x<curX?-1:1;
  if(curY>FLOOR){ // hop down to the floor first
    setPose('sit');setFace(dir);catEl.classList.add('jump');
    setXY(curX+dir*5,FLOOR,'bottom 420ms cubic-bezier(.35,0,.85,1), left 420ms ease-out');
    await sleep(440);if(id!==moveId)return;catEl.classList.remove('jump');
  }
  const dist=Math.abs(t.x-curX);
  if(dist>1.5){
    const dur=Math.max(450,dist*55);
    setFace(dir);setPose('walk');catEl.classList.add('walking');
    setXY(t.x,FLOOR,`left ${dur}ms linear`);
    await sleep(dur+40);if(id!==moveId)return;
    catEl.classList.remove('walking');
  }
  if(t.y>FLOOR){ // hop up
    setPose('sit');catEl.classList.add('jump');
    setXY(t.x,t.y,'bottom 460ms cubic-bezier(.2,0,.55,1)');
    await sleep(480);if(id!==moveId)return;catEl.classList.remove('jump');
  }
  setPose(pose);setFace(face);
}
function say(t,ms){bubble.textContent=t;bubble.hidden=false;clearTimeout(say.t);if(ms)say.t=setTimeout(()=>{bubble.hidden=true},ms)}
function hush(){bubble.hidden=true}
function catRect(){const r=catEl.getBoundingClientRect(),sr=scene.getBoundingClientRect();return{l:(r.left-sr.left)/sr.width*100,t:(r.top-sr.top)/sr.height*100,w:r.width/sr.width*100,h:r.height/sr.height*100}}
function hearts(n){const c=catRect();
  for(let i=0;i<n;i++){const h=document.createElement('span');h.className='heart';h.textContent='♥';
    h.style.left=(c.l+c.w*(.3+Math.random()*.4))+'%';h.style.top=c.t+'%';h.style.setProperty('--dx',(Math.random()*6-3)+'cqw');
    h.style.animationDelay=(i*120)+'ms';scene.appendChild(h);setTimeout(()=>h.remove(),1700)}}
function crumbs(){for(let i=0;i<3;i++){const s=document.createElement('span');s.className='crumb';
  s.style.left=(77+Math.random()*7)+'%';s.style.bottom='9%';s.style.setProperty('--dx',(Math.random()*4-2)+'cqw');scene.appendChild(s);setTimeout(()=>s.remove(),800)}}
function caption(t){$('#caption').textContent=fill(t)}

/* small fidgets so the cat never looks frozen */
function fidget(){
  const p=catEl.dataset.pose;if(reduced()||catEl.classList.contains('walking')||catEl.classList.contains('jump'))return;
  const o=[];
  if(['sit','wait','lie','groom','sleep','back'].includes(p))o.push('twitch','flick');
  if(['sit','wait','lie','back'].includes(p))o.push('look-l','look-r','look-l','look-r');
  if(['sit','lie'].includes(p))o.push('yawn');
  if(!o.length)return;const c=o[Math.floor(Math.random()*o.length)];
  catEl.classList.remove('look-l','look-r');catEl.classList.add(c);
  setTimeout(()=>catEl.classList.remove(c),c==='yawn'?1500:c.startsWith('look')?1900:650);
}
(function fidgetLoop(){setTimeout(()=>{fidget();fidgetLoop()},2200+Math.random()*3200)})();

const IDLE=[
  {spot:'sofa',pose:'sleep',face:1,w:5,msg:'{N는} 소파에서 자고 있어요'},
  {spot:'sofa',pose:'lie',face:1,w:2,msg:'{N가} 소파에서 뒹굴고 있어요'},
  {spot:'win',pose:'back',face:1,w:3,msg:'{N가} 소파 등받이에 올라가 창밖을 보고 있어요'},
  {spot:'rug',pose:'groom',face:-1,w:2,msg:'{N가} 러그 위에서 그루밍 중이에요'},
  {spot:'rug',pose:'stretch',face:-1,w:1,msg:'{N가} 기지개를 쭉 켜요',then:'sit'},
  {spot:'mid',pose:'sit',face:1,w:1,msg:'{N가} 방 한가운데 앉아서 이쪽을 보고 있어요'}
];
function scheduleIdle(){clearTimeout(idleTimer);if(!(run&&run.state==='focus'&&phase==='idle'))return;
  const d=run.demo?4500+Math.random()*3000:15000+Math.random()*25000;
  idleTimer=setTimeout(()=>{pickIdle();scheduleIdle()},d)}
function pickIdle(){const tot=IDLE.reduce((a,b)=>a+b.w,0);let r=Math.random()*tot,c=IDLE[0];
  for(const i of IDLE){r-=i.w;if(r<=0){c=i;break}}
  if(c.spot===catEl.dataset.spot&&c.pose===catEl.dataset.pose)return;
  const id=moveId+1;
  moveCat(c.spot,c.pose,c.face).then(()=>{if(c.then&&moveId===id)setTimeout(()=>{if(moveId===id&&catEl.dataset.pose===c.pose)setPose(c.then)},2500)});
  setStatus(c.msg)}
function setStatus(t){$('#focusStatus').textContent=fill(t);caption(t)}

/* ---------- audio / wake lock ---------- */
function ensureAudio(){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function chime(){try{if(!audioCtx)return;const t=audioCtx.currentTime;[[659,0],[880,.22],[1046,.44]].forEach(([f,d])=>{
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.18,t+d+.03);g.gain.exponentialRampToValueAtTime(.001,t+d+.7);
  o.connect(g).connect(audioCtx.destination);o.start(t+d);o.stop(t+d+.75)})}catch(e){}}
function crunch(){try{if(!audioCtx)return;const n=audioCtx.sampleRate*.06,b=audioCtx.createBuffer(1,n,audioCtx.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=audioCtx.createBufferSource(),f=audioCtx.createBiquadFilter(),g=audioCtx.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=1800+Math.random()*800;g.gain.value=.12;
  s.connect(f).connect(g).connect(audioCtx.destination);s.start()}catch(e){}}
let lock=null;function wake(){try{if(navigator.wakeLock&&!lock)navigator.wakeLock.request('screen').then(l=>{lock=l;l.addEventListener('release',()=>{lock=null})}).catch(()=>{})}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&run)wake()});

/* ---------- UI ---------- */
function show(id){ui=id;['setup','focus','done','after','break'].forEach(k=>{$('#ui-'+k).hidden=k!==id})}
const fmt=s=>{s=Math.ceil(s/1000);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':':'')+(h?pad(m):m<10?'0'+m:m)+':'+pad(x)};
function tick(){
  if(!run){document.title=petName+'네 방';return}
  const rem=Math.max(0,run.endAt-Date.now());
  if(run.state==='focus'){
    $('#clock').textContent=fmt(rem);$('#barFill').style.width=(100-rem/(run.dur*1000)*100)+'%';
    document.title=fmt(rem)+' · '+petName+'네 방';
    const waitAt=run.demo?12000:120000;
    if(phase==='idle'&&rem<=waitAt&&rem>0)enterWait();
    if(rem===0)complete(true);
  }else if(run.state==='break'){
    $('#breakClock').textContent=fmt(rem);document.title='쉬는 중 '+fmt(rem)+' · '+petName+'네 방';
    if(rem===0)endBreak();
  }else{document.title='간식 시간! · '+petName+'네 방'}
}
setInterval(tick,250);

function start(sec,demo){
  run={state:'focus',endAt:Date.now()+sec*1000,dur:sec,demo:!!demo};store.set('run',run);phase='idle';
  ensureAudio();wake();hush();bowl.dataset.level=0;
  catEl.classList.remove('petable');
  const wasSulking = isSulking || store.get('sulking', false) || (log.items.length && log.items[log.items.length-1].type==='stop');
  isSulking=false;store.del('sulking');

  if(wasSulking){
    moveCat('sofa','stretch',1);
    say('야옹!', 2400);
    hearts(3);
    caption(fill('{N가} "다시 왔구나!" 하고 시원하게 기지개를 켜며 반겨줘요.'));
    setStatus(demo?'{N가} 반갑게 기지개를 켜고 자러 가요 (30초 체험)':'{N가} 기지개를 켜고 편안하게 소파에 누웠어요');
    setTimeout(()=>{
      if(run&&run.state==='focus'){
        setPose('sleep');
        setStatus(demo?'{N는} 소파에서 자고 있어요 (30초 체험)':'{N는} 소파에서 자고 있어요');
      }
    }, 2400);
  } else {
    moveCat('sofa','sleep',1);
    setStatus(demo?'{N는} 소파에서 자고 있어요 (30초 체험)':'{N는} 소파에서 자고 있어요');
  }
  show('focus');tick();scheduleIdle();
}
function enterWait(){phase='wait';clearTimeout(idleTimer);
  moveCat('bowl','wait',1).then(()=>{if(phase==='wait'||phase==='done')say('…')});
  setStatus(run.demo?'{N가} 밥그릇 앞에 앉아서 기다리고 있어요':'{N가} 밥그릇 앞에 앉아서 기다리고 있어요. 2분 남았어요')}
function complete(withSound){
  clearTimeout(idleTimer);run.state='done';store.set('run',run);phase='done';
  if(withSound)chime();
  moveCat('bowl','wait',1).then(()=>{if(phase==='done')say('!')});
  $('#doneMsg').textContent=fill('{N가} 끝까지 기다렸어요. 간식을 주세요.');caption('{N가} 밥그릇 앞에서 올려다보고 있어요');
  show('done');
}
async function giveTreat(){
  const btn=$('#treatBtn');btn.disabled=true;hush();phase='eating';
  const t=$('#treat');t.classList.remove('drop');void t.offsetWidth;t.classList.add('drop');
  const id=moveId+1;
  await sleep(700);bowl.dataset.level=3;t.classList.remove('drop');
  await moveCat('eat','eat',1);if(moveId!==id)return;
  caption('냠냠, 오독오독…');
  for(let lv=3;lv>0;lv--){
    for(let k=0;k<3;k++){await sleep(420);if(moveId!==id)return;crunch();if(k===1)crumbs()}
    bowl.dataset.level=lv-1;
  }
  await sleep(300);if(moveId!==id)return;
  setPose('lick');caption('{N가} 입맛을 다셔요');hearts(3);
  log.items.push({type:'done',min:run.demo?0:Math.round(run.dur/60),demo:!!run.demo});store.set('log',log);renderLog();
  const last=run;run=null;store.del('run');phase='idle';
  $('#afterMsg').textContent=fill(last.demo?'체험 세션이라 시간은 쌓이지 않지만, 책은 한 권 올라갔어요. {N가} 기분이 좋아 보여요.':'책이 한 권 쌓였어요. {N가} 기분이 좋아 보여요.');
  show('after');btn.disabled=false;
  await sleep(1500);if(moveId!==id)return;
  setPose('groom');caption('{N가} 앞발로 세수를 해요');hearts(4);
  await sleep(2400);if(moveId!==id)return;
  await moveCat('sofa','lie',1);if(moveId!==id+1)return;
  caption('{N가} 배부른 얼굴로 소파에 누웠어요');
}
function startBreak(sec){
  run={state:'break',endAt:Date.now()+sec*1000,dur:sec,demo:false};store.set('run',run);
  moveCat('rug','sit',-1);catEl.classList.add('petable');
  $('#breakStatus').textContent=fill('{N를} 눌러서 쓰다듬어 보세요.');caption('쉬는 시간. {N를} 눌러서 쓰다듬어 보세요');
  show('break');tick();
}
function endBreak(){
  chime();run=null;store.del('run');catEl.classList.remove('petable');hush();
  moveCat('sofa','lie',1);caption('{N가} 자기 자리로 돌아갔어요. 다음 세션을 시작해 볼까요?');
  $('#setupMsg').textContent=fill('쉬는 시간이 끝났어요. {N가} 자기 자리로 돌아갔어요.');
  show('setup');
}
function doStop(){
  const elapsed=run?Math.round((run.dur*1000-(run.endAt-Date.now()))/60000):0;
  clearTimeout(idleTimer);run=null;store.del('run');phase='idle';hush();$('#stopModal').hidden=true;
  log.items.push({type:'stop',min:elapsed});store.set('log',log);renderLog();
  isSulking=true;store.set('sulking',true);
  caption(fill('{N가} 소파 구석으로 걸어가요…'));
  const id=moveId+1;
  moveCat('sofa','back',1).then(()=>{
    if(moveId!==id)return;
    clearTimeout(lookTimer);
    say('힝…', 2800);
    catEl.classList.add('petable');
    caption(fill('{N가} "벌써 끝난 거야…?" 하고 소파 구석에서 삐진 척 등을 돌렸어요. 다음 타이머를 켜면 반겨줄 거예요.'));
  });
  $('#setupMsg').textContent=fill('{N가} 조금 서운해하고 있어요. 다음 타이머를 켜면 기지개를 켜며 반겨줄 거예요!');
  show('setup');
}

/* ---------- log ---------- */
const BOOK=['#b2574f','#4f6d8a','#7a8a4f','#c9933e','#6a5a8a','#8a5a3c'];
function renderLog(){
  const done=log.items.filter(i=>i.type==='done'),stops=log.items.filter(i=>i.type==='stop');
  const mins=done.reduce((a,b)=>a+b.min,0);
  const books=$('#books');books.innerHTML='';
  done.slice(0,9).forEach((b,i)=>{const d=document.createElement('div');d.className='book';d.style.background=BOOK[i%BOOK.length];
    d.style.width=(72+((i*37)%28))+'%';d.style.marginLeft=((i*13)%14)+'%';books.appendChild(d)});
  if(done.length>9){const m=document.createElement('span');m.className='more';m.textContent='+'+(done.length-9);books.appendChild(m)}
  const h=Math.floor(mins/60),m=mins%60;const tstr=(h?h+'시간 ':'')+(m||!h?m+'분':'');
  $('#todaySum').textContent=done.length?`오늘 ${done.length}세션 · ${tstr}`:'';
  $('#logSum').textContent=done.length||stops.length?`오늘 ${done.length}세션 · ${tstr}`+(stops.length?` · 빈 밥그릇 ${stops.length}`:''):'';
  const it=$('#logItems');it.innerHTML='';
  log.items.forEach((x,i)=>{const d=document.createElement('span');
    if(x.type==='done'){d.className='lg-book';d.style.background=BOOK[i%BOOK.length];d.title=x.demo?'체험 세션':x.min+'분 집중'}
    else{d.className='lg-stop';d.title='중간에 멈춤 ('+x.min+'분)'}
    it.appendChild(d)});
  $('#logEmpty').hidden=log.items.length>0;
}

/* ---------- time of day ---------- */
function tod(){const o=store.get('tod','auto');if(o!=='auto')return o;const h=new Date().getHours();
  return h>=6&&h<10?'morning':h<17?'day':h<20?'sunset':'night'}
function applyTod(){scene.classList.remove('t-morning','t-day','t-sunset','t-night');scene.classList.add('t-'+tod())}
setInterval(applyTod,60000);

/* ---------- share card ---------- */
function drawCard(){
  const c=$('#card'),x=c.getContext('2d'),W=1080,H=1920,t=tod();
  const P={morning:['#f6e3c6','#e9cfae','#bfe0f4','#fbe7c2','#f2e0c8'],day:['#efdcc3','#dcc3a6','#9fd0ef','#e3f1f8','#ead6bf'],
    sunset:['#eac4a3','#cfa07c','#f3a46b','#7d4f7f','#e6c3a2'],night:['#2f2633','#1f1a24','#141a38','#2b365f','#4a3b47']}[t];
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,P[0]);g.addColorStop(1,P[1]);x.fillStyle=g;x.fillRect(0,0,W,H);
  const dark=t==='night';const ink=dark?'#efe5d6':'#372c25',mut=dark?'#b9aa9d':'#857566';
  const ff='"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",sans-serif';
  const rx=90,ry=420,rw=W-180,rh=900;
  x.save();x.beginPath();x.roundRect(rx,ry,rw,rh,40);x.clip();
  x.fillStyle=P[4];x.fillRect(rx,ry,rw,rh*.72);
  x.fillStyle=dark?'#5a3f33':'#b98a5c';x.fillRect(rx,ry+rh*.72,rw,rh*.28);
  x.fillStyle='rgba(0,0,0,.14)';x.fillRect(rx,ry+rh*.72-10,rw,12);
  const wx=rx+rw*.07,wy=ry+rh*.08,ww=rw*.25,wh=rh*.34;
  const sg=x.createLinearGradient(0,wy,0,wy+wh);sg.addColorStop(0,P[2]);sg.addColorStop(1,P[3]);
  x.fillStyle='#efe4d2';x.fillRect(wx-10,wy-10,ww+20,wh+20);x.fillStyle=sg;x.fillRect(wx,wy,ww,wh);
  x.fillStyle=dark?'#f4f0d8':'#ffe9a8';x.beginPath();x.arc(wx+ww*.72,wy+wh*.3,ww*.1,0,7);x.fill();
  x.fillStyle='#efe4d2';x.fillRect(wx+ww/2-5,wy,10,wh);x.fillRect(wx,wy+wh/2-5,ww,10);
  const sx=rx+rw*.04,sy=ry+rh*.46,sw=rw*.36,sh=rh*.24;
  x.fillStyle='#6f8f7a';x.beginPath();x.roundRect(sx+sw*.05,sy,sw*.9,sh*.58,24);x.fill();
  x.fillStyle='#7fa08a';x.beginPath();x.roundRect(sx,sy+sh*.46,sw,sh*.44,18);x.fill();
  x.fillStyle='#6a8a75';x.beginPath();x.roundRect(sx,sy+sh*.26,sw*.12,sh*.64,20);x.roundRect(sx+sw*.88,sy+sh*.26,sw*.12,sh*.64,20);x.fill();
  x.fillStyle='#b35d63';x.beginPath();x.ellipse(rx+rw*.51,ry+rh*.9,rw*.17,rh*.06,0,0,7);x.fill();
  x.strokeStyle='#d9a66f';x.lineWidth=8;x.beginPath();x.ellipse(rx+rw*.51,ry+rh*.9,rw*.125,rh*.044,0,0,7);x.stroke();
  const dx=rx+rw*.6,dy=ry+rh*.6,dw=rw*.24;
  x.fillStyle='#7b5234';x.beginPath();x.roundRect(dx,dy,dw,22,6);x.fill();
  x.fillStyle='#67432d';x.fillRect(dx+dw*.05,dy+22,16,rh*.12);x.fillRect(dx+dw*.88,dy+22,16,rh*.12);
  const done=log.items.filter(i=>i.type==='done');
  done.slice(0,9).forEach((b,i)=>{x.fillStyle=BOOK[i%BOOK.length];const bw=dw*.36*(.72+((i*37)%28)/100);x.beginPath();x.roundRect(dx+dw*.05+((i*13)%14)/100*dw*.36,dy-18-i*18,bw,16,3);x.fill()});
  x.fillStyle='#5b4a3a';x.fillRect(dx+dw*.78,dy-120,8,120);x.fillStyle='#e8c47a';x.beginPath();x.moveTo(dx+dw*.68,dy-120);x.lineTo(dx+dw*.98,dy-120);x.lineTo(dx+dw*1.02,dy-70);x.lineTo(dx+dw*.64,dy-70);x.closePath();x.fill();
  if(dark){const lg=x.createRadialGradient(dx+dw*.82,dy-100,10,dx+dw*.82,dy-100,260);lg.addColorStop(0,'rgba(255,214,120,.5)');lg.addColorStop(1,'rgba(255,214,120,0)');x.fillStyle=lg;x.fillRect(dx-300,dy-400,700,700)}
  const cx=sx+sw*.48,cy=sy+sh*.5;
  x.fillStyle='#e39a4c';x.beginPath();x.ellipse(cx,cy,sw*.26,sh*.22,0,0,7);x.fill();
  x.beginPath();x.arc(cx+sw*.2,cy-sh*.1,sw*.11,0,7);x.fill();
  x.beginPath();x.moveTo(cx+sw*.12,cy-sh*.18);x.lineTo(cx+sw*.14,cy-sh*.42);x.lineTo(cx+sw*.2,cy-sh*.2);x.closePath();x.fill();
  x.beginPath();x.moveTo(cx+sw*.22,cy-sh*.2);x.lineTo(cx+sw*.27,cy-sh*.42);x.lineTo(cx+sw*.29,cy-sh*.17);x.closePath();x.fill();
  x.strokeStyle='#2e2a24';x.lineWidth=5;x.lineCap='round';x.beginPath();x.moveTo(cx+sw*.15,cy-sh*.1);x.quadraticCurveTo(cx+sw*.17,cy-sh*.05,cx+sw*.19,cy-sh*.1);x.moveTo(cx+sw*.22,cy-sh*.1);x.quadraticCurveTo(cx+sw*.24,cy-sh*.05,cx+sw*.26,cy-sh*.1);x.stroke();
  x.strokeStyle='#e39a4c';x.lineWidth=18;x.beginPath();x.moveTo(cx-sw*.24,cy+sh*.05);x.quadraticCurveTo(cx-sw*.4,cy-sh*.05,cx-sw*.36,cy-sh*.3);x.stroke();
  if(dark){x.fillStyle='rgba(15,10,40,.22)';x.fillRect(rx,ry,rw,rh)}
  x.restore();
  const mins=done.reduce((a,b)=>a+b.min,0),h=Math.floor(mins/60),m=mins%60;
  const d=new Date(),days=['일','월','화','수','목','금','토'];
  x.textAlign='center';x.fillStyle=mut;x.font='400 44px '+ff;
  x.fillText(`${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${days[d.getDay()]}`,W/2,230);
  x.fillStyle=ink;x.font='400 150px '+ff;
  x.fillText((h?h+'시간 ':'')+(m||!h?m+'분':''),W/2,360);
  x.font='400 54px '+ff;x.fillStyle=ink;
  x.fillText(fill(`{N와} 함께 ${done.length}세션을 보냈어요`),W/2,1460);
  x.fillStyle=mut;x.font='400 40px '+ff;
  const stops=log.items.filter(i=>i.type==='stop').length;
  x.fillText(stops?`빈 밥그릇 ${stops}개는 내일 채우기로`:'밥그릇은 한 번도 비지 않았어요',W/2,1540);
  x.font='400 46px '+ff;x.fillStyle=mut;x.fillText(petName+'네 방',W/2,1800);
}

$$('.chip').forEach(b=>b.addEventListener('click',()=>{$$('.chip').forEach(c=>c.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');$('#customMin').value=b.dataset.min}));

$('#demoBtn').addEventListener('click',()=>start(30,true));

$('#keepBtn').addEventListener('click',()=>{$('#stopModal').hidden=true});
$('#confirmStop').addEventListener('click',doStop);

$$('[data-break]').forEach(b=>b.addEventListener('click',()=>startBreak(+b.dataset.break*60)));

  }
});
$('#petName').value=petName;
const sizeName=()=>{const i=$('#petName');i.style.width=(i.value.length*1.15+.9)+'em'};sizeName();$('#petName').addEventListener('input',sizeName);
$('#petName').addEventListener('change',e=>{const v=e.target.value.trim()||'콩이';petName=v;e.target.value=v;store.set('petName',v);renderLog();tick()});
$('#todSel').value=store.get('tod','auto');
$('#todSel').addEventListener('change',e=>{store.set('tod',e.target.value);applyTod()});
$('#shareBtn').addEventListener('click',()=>{const go=()=>{drawCard();$('#shareModal').hidden=false};(document.fonts&&document.fonts.ready?document.fonts.ready.then(go,go):go())});
$('#closeShare').addEventListener('click',()=>{$('#shareModal').hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#shareModal').hidden=true;$('#stopModal').hidden=true}});

/* ---------- boot ---------- */
applyTod();renderLog();
if(run&&run.state==='focus'){
  const rem=run.endAt-Date.now();
  if(rem<=0){moveCat('bowl','wait',1,{instant:true});complete(false)}
  else{show('focus');const waitAt=run.demo?12000:120000;
    if(rem<=waitAt){moveCat('bowl','wait',1,{instant:true});phase='wait';setStatus('{N가} 밥그릇 앞에 앉아서 기다리고 있어요');say('…')}
    else{moveCat('sofa','sleep',1,{instant:true});setStatus('{N는} 소파에서 자고 있어요');scheduleIdle()}
    tick()}
}else if(run&&run.state==='done'){moveCat('bowl','wait',1,{instant:true});complete(false)}
else if(run&&run.state==='break'){if(run.endAt<=Date.now()){run=null;store.del('run');moveCat('sofa','lie',1,{instant:true});show('setup')}else{moveCat('rug','sit',-1,{instant:true});catEl.classList.add('petable');$('#breakStatus').textContent=fill('{N를} 눌러서 쓰다듬어 보세요.');caption('쉬는 시간. {N를} 눌러서 쓰다듬어 보세요');show('break');tick()}}
else{
  const lastStop=isSulking || store.get('sulking', false) || (log.items.length && log.items[log.items.length-1].type==='stop');
  if(lastStop){
    isSulking=true;
    moveCat('sofa','back',1,{instant:true});
    catEl.classList.add('petable');
    caption(fill('{N가} 소파 구석에서 등을 돌리고 쉬고 있어요'));
    $('#setupMsg').textContent=fill('{N가} 조금 서운해하고 있어요. 타이머를 시작하면 기지개를 켜며 반겨줄 거예요!');
  } else {
    moveCat('sofa','sleep',1,{instant:true});
    caption(fill('{N는} 소파에서 자고 있어요'));
  }
  show('setup');
}
})();
